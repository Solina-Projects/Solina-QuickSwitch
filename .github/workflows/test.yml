name: Test

on:
  push:
    branches:
      - main
      - "solina/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository and safety checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate project state and release safeguards
        run: bash scripts/validate-project.sh

      - name: Test read-only compatibility probe using simulated fixtures
        run: bash tests/test-probe.sh

      - name: Test conservative capability resolver
        run: bash tests/test-resolver.sh

      - name: Test fail-closed plan preview
        run: bash tests/test-plan.sh
